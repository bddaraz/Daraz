<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>পণ্যের বিস্তারিত — Easy Shop</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#222;font-family:system-ui,-apple-system,"Noto Sans Bengali",Arial,sans-serif}.wrap{max-width:950px;margin:25px auto;padding:0 15px}.bar{background:white;padding:15px;border-radius:12px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;color:#f85606;font-size:23px;text-decoration:none}.panel{background:#fff;border-radius:14px;padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:25px}.image{min-height:300px;background:#fff1e8;border-radius:12px;display:grid;place-items:center;font-size:100px;overflow:hidden}.image img{width:100%;height:100%;object-fit:cover}.price{font-size:28px;color:#f85606;font-weight:850}.old{color:#999;text-decoration:line-through;font-size:15px;margin-left:8px}.btn{display:inline-block;border:0;border-radius:8px;padding:12px 16px;background:#f85606;color:white;text-decoration:none;font-weight:750;margin:8px 8px 0 0}.secondary{background:#fff0e8;color:#f85606}.muted{color:#777;font-size:13px}.desc{line-height:1.8;white-space:pre-wrap}@media(max-width:650px){.panel{grid-template-columns:1fr}.image{min-height:230px}.wrap{margin:12px auto}}
</style></head><body><div class="wrap"><div class="bar"><a class="logo" href="index.html">Easy Shop.</a><a href="index.html">← সব পণ্য</a></div><div id="content" class="panel">পণ্য লোড হচ্ছে…</div></div>
<script>
const seed=[{id:1,name:"প্রিমিয়াম কটন টি-শার্ট",category:"ফ্যাশন",price:450,oldPrice:600,emoji:"👕",description:"আরামদায়ক কটন টি-শার্ট। সাইজ ও রং অর্ডারের সময় নিশ্চিত করুন।"},{id:2,name:"ওয়্যারলেস ব্লুটুথ ইয়ারবাড",category:"ইলেকট্রনিক্স",price:890,oldPrice:1200,emoji:"🎧",description:"দৈনন্দিন ব্যবহারের জন্য ওয়্যারলেস ইয়ারবাড।"},{id:3,name:"স্টাইলিশ ব্যাকপ্যাক",category:"ব্যাগ",price:750,oldPrice:950,emoji:"🎒",description:"কাজ, পড়াশোনা ও ভ্রমণের জন্য ব্যবহারযোগ্য ব্যাকপ্যাক।"},{id:4,name:"স্কিন কেয়ার সেট",category:"সৌন্দর্য",price:650,oldPrice:800,emoji:"🧴",description:"ব্যবহারের আগে উপাদান ও আপনার ত্বকের উপযোগিতা যাচাই করুন।"},{id:5,name:"ডেস্ক ল্যাম্প",category:"ঘর",price:520,oldPrice:700,emoji:"💡",description:"পড়ার টেবিল ও কাজের জায়গার জন্য সুন্দর ডেস্ক ল্যাম্প।"},{id:6,name:"স্টিল পানির বোতল",category:"অন্যান্য",price:320,oldPrice:400,emoji:"🧴",description:"দৈনন্দিন ব্যবহারের পানির বোতল।"},{id:7,name:"সানগ্লাস",category:"ফ্যাশন",price:390,oldPrice:550,emoji:"🕶️",description:"ক্যাজুয়াল ব্যবহারের স্টাইলিশ সানগ্লাস।"},{id:8,name:"মিনি ব্লুটুথ স্পিকার",category:"ইলেকট্রনিক্স",price:990,oldPrice:1300,emoji:"🔊",description:"ছোট আকারের পোর্টেবল স্পিকার।"}];
let ps;try{ps=JSON.parse(localStorage.getItem("easyshop_products"))||seed}catch{ps=seed}
const id=new URLSearchParams(location.search).get("id"),p=ps.find(x=>String(x.id)===String(id)),money=n=>"৳"+Number(n||0).toLocaleString("en-US");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
if(!p)document.getElementById("content").innerHTML='<div><h2>পণ্যটি পাওয়া যায়নি</h2><a class="btn" href="index.html">হোমে ফিরুন</a></div>';
else document.getElementById("content").innerHTML=`<div class="image">${p.image?`<img src="${esc(p.image)}">`:p.emoji||"🛍️"}</div><div><p class="muted">${esc(p.category||"অন্যান্য")}</p><h1>${esc(p.name)}</h1><div class="price">${money(p.price)} ${p.oldPrice?`<span class="old">${money(p.oldPrice)}</span>`:""}</div><p class="desc">${esc(p.description||"পণ্যের বিস্তারিত তথ্যের জন্য যোগাযোগ করুন।")}</p><p>⭐ ⭐ ⭐ ⭐ ⭐ <span class="muted">পণ্যের তথ্য যাচাই করে অর্ডার করুন</span></p><button class="btn" onclick="addCart()">কার্টে যোগ করুন</button><button class="btn secondary" onclick="buyNow()">এখনই কিনুন</button>${p.link?`<a class="btn secondary" href="${esc(p.link)}" target="_blank" rel="noopener">বাইরের লিংক থেকে কিনুন ↗</a>`:""}<p class="muted">ডেলিভারি, সাইজ/রং ও পেমেন্টের তথ্য অর্ডারের আগে নিশ্চিত করুন।</p></div>`;
function addCart(){let c=[];try{c=JSON.parse(localStorage.getItem("easyshop_cart"))||[]}catch{}c.push({id:p.id,name:p.name,price:p.price,qty:1});localStorage.setItem("easyshop_cart",JSON.stringify(c));alert("কার্টে যোগ হয়েছে");location.href="index.html"}
function buyNow(){let c=[];try{c=JSON.parse(localStorage.getItem("easyshop_cart"))||[]}catch{}c.push({id:p.id,name:p.name,price:p.price,qty:1});localStorage.setItem("easyshop_cart",JSON.stringify(c));location.href="index.html";setTimeout(()=>{},100)}
</script></body></html>
